<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="t d">
<title id="t">Vista general de una sala de operaciones</title><desc id="d">Ilustración educativa de un quirófano moderno con mesa quirúrgica, lámparas, monitor, estación de anestesia, mesa de instrumental y áreas de apoyo.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#eaf5fb"/><stop offset="1" stop-color="#c8dce8"/></linearGradient>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#dceaf2"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#b6cedb"/><stop offset="1" stop-color="#7898aa"/></linearGradient>
 <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#38b7df"/><stop offset="1" stop-color="#087eae"/></linearGradient>
 <linearGradient id="steel" x2="0" y2="1"><stop stop-color="#f7fbfd"/><stop offset="1" stop-color="#7f9baa"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
