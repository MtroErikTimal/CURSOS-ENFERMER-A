<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="t d"><title id="t">Zonificación del área quirúrgica</title><desc id="d">Comparación educativa de zonas negra, gris y blanca.</desc><rect width="1200" height="690" rx="28" fill="#f1f7fa"/><text x="55" y="72" font-family="Arial" font-size="38" font-weight="700" fill="#153c50">Zonificación del área quirúrgica</text><text x="55" y="112" font-family="Arial" font-size="20" fill="#557080">De la circulación general al entorno de acceso restringido</text><g transform="translate(55 155)"><rect width="340" height="405" rx="22" fill="#fff" stroke="#d5e2e8" stroke-width="3"/><rect width="340" height="82" rx="22" fill="#35495a"/><text x="170" y="53" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">ZONA NEGRA</text><text x="28" y="132" font-family="Arial" font-size="22" font-weight="700" fill="#263c4b">Acceso y transición</text><g font-family="Arial" font-size="20" fill="#526575"><text x="28" y="184">• Recepción y transferencia</text><text x="28" y="229">• Vestidores y oficinas</text><text x="28" y="274">• Verificación inicial</text><text x="28" y="319">• Ingreso controlado</text></g><rect x="24" y="350" width="292" height="38" rx="12" fill="#edf1f4"/><text x="170" y="376" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#354a59">Menor restricción relativa</text></g><path d="M410 355h40m-13-13 13 13-13 13" stroke="#477d8a" stroke-width="6" fill="none"/><g transform="translate(455 155)"><rect width="340" height="405" rx="22" fill="#fff" stroke="#d5e2e8" stroke-width="3"/><rect width="340" height="82" rx="22" fill="#287c91"/><text x="170" y="53" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">ZONA GRIS</text><text x="28" y="132" font-family="Arial" font-size="22" font-weight="700" fill="#263c4b">Área semirrestringida</text><g font-family="Arial" font-size="20" fill="#526575"><text x="28" y="184">• Pasillos internos</text><text x="28" y="229">• Lavado quirúrgico</text><text x="28" y="274">• Preparación de material</text><text x="28" y="319">• Uniforme quirúrgico</text></g><rect x="24" y="350" width="292" height="38" rx="12" fill="#e7f4f7"/><text x="170" y="376" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#246477">Acceso controlado</text></g><path d="M810 355h40m-13-13 13 13-13 13" stroke="#477d8a" stroke-width="6" fill="none"/><g transform="translate(855 155)"><rect width="290" height="405" rx="22" fill="#fff" stroke="#d5e2e8" stroke-width="3"/><rect width="290" height="82" rx="22" fill="#16816e"/><text x="145" y="53" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">ZONA BLANCA</text><text x="24" y="132" font-family="Arial" font-size="22" font-weight="700" fill="#263c4b">Área restringida</text><g font-family="Arial" font-size="19" fill="#526575"><text x="24" y="184">• Salas de operaciones</text><text x="24" y="229">• Control estricto</text><text x="24" y="274">• Barreras según riesgo</text><text x="24" y="319">• Tránsito indispensable</text></g><rect x="18" y="350" width="254" height="38" rx="12" fill="#e4f5ef"/><text x="145" y="376" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#16705f">Mayor restricción</text></g><rect x="55" y="585" width="1090" height="62" rx="16" fill="#fff4df"/><text x="80" y="623" font-family="Arial" font-size="18" font-weight="700" fill="#795b25">Nota:</text><text x="145" y="623" font-family="Arial" font-size="17" fill="#705f42">esquema didáctico; nombres, límites y circuitos varían según hospital y protocolo.</text></svg>