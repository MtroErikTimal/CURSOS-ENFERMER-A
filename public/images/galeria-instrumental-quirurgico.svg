jidos o material</text></g><g transform="translate(425 430)"><rect width="350" height="250" rx="18" fill="#fff" stroke="#c9ddd4"/><text x="22" y="36" font-size="22" font-weight="700">5. Separación</text><path d="M90 100 L90 190 L255 190 L255 100" fill="none" stroke="#547c6e" stroke-width="16" stroke-linejoin="round"/><text x="22" y="225" font-size="16" fill="#52736a">Exposición del campo operatorio</text></g><g transform="translate(810 430)"><rect width="350" height="250" rx="18" fill="#fff" stroke="#c9ddd4"/><text x="22" y="36" font-size="22" font-weight="700">6. Sutura · portaagujas</text><circle cx="100" cy="145" r="22" fill="none" stroke="#547c6e" stroke-width="9"/><circle cx="100" cy="205" r="22" fill="none" stroke="#547c6e" stroke-width="9"/><path d="M120 145 L260 125 M120 205 L260 170" stroke="#547c6e" stroke-width="11" stroke-linecap="round"/><text x="22" y="238" font-size="16" fill="#52736a">Sostiene la aguja durante la sutura</text></g></g></svg>