<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Elementos de una sala de operaciones</title><desc id="d">Esquema de mesa quirúrgica, lámparas, monitor, anestesia, instrumental y aspiración.</desc><rect width="1200" height="760" rx="28" fill="#f1f7fa"/><text x="55" y="70" font-family="Arial" font-size="38" font-weight="700" fill="#153c50">Elementos de una sala de operaciones</text><text x="55" y="110" font-family="Arial" font-size="20" fill="#557080">Vista superior esquemática · distribución ilustrativa</text><rect x="155" y="150" width="890" height="520" rx="25" fill="#fff" stroke="#9db8c5" stroke-width="10"/><rect x="180" y="175" width="840" height="470" rx="18" fill="#eaf3f7"/><rect x="485" y="350" width="230" height="145" rx="20" fill="#2e87a7" stroke="#15536c" stroke-width="5"/><rect x="510" y="380" width="180" height="85" rx="12" fill="#ccecf5"/><text x="600" y="530" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#17485d">Mesa quirúrgica</text><g fill="#f8d66d" stroke="#b58a27" stroke-width="4"><circle cx="430" cy="250" r="48"/><circle cx="770" cy="250" r="48"/></g><g stroke="#fff" stroke-width="7"><path d="M430 214v72m-36-36h72M770 214v72m-36-36h72"/></g><g font-family="Arial" font-size="20" font-weight="700" fill="#31556a"><text x="430" y="185" text-anchor="middle">Lámpara</text><text x="770" y="185" text-anchor="middle">Lámpara</text></g><rect x="220" y="340" width="190" height="130" rx="14" fill="#d9e8ef" stroke="#52778b" stroke-width="4"/><rect x="242" y="360" width="146" height="65" rx="8" fill="#233f58"/><path d="M255 405l25-20 22 13 24-25 42 33" fill="none" stroke="#5be0c1" stroke-width="5"/><text x="315" y="505" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#28485a">Monitor</text><rect x="790" y="340" width="205" height="130" rx="14" fill="#d9e8ef" stroke="#52778b" stroke-width="4"/><rect x="815" y="360" width="155" height="65" rx="8" fill="#233f58"/><circle cx="892" cy="392" r="20" fill="#77c6d7"/><text x="892" y="505" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#28485a">Anestesia</text><rect x="790" y="535" width="205" height="70" rx="12" fill="#d8f0e9" stroke="#388a78" stroke-width="4"/><text x="892" y="578" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#236a5a">Mesa instrumental</text><rect x="220" y="545" width="190" height="60" rx="12" fill="#e6eaf4" stroke="#6a7895" stroke-width="4"/><text x="315" y="583" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#40536f">Aspiración</text><rect x="55" y="690" width="1090" height="48" rx="14" fill="#fff4df"/><text x="80" y="721" font-family="Arial" font-size="17" fill="#795b25">La ubicación real depende del procedimiento, la infraestructura y el protocolo del hospital.</text></svg>