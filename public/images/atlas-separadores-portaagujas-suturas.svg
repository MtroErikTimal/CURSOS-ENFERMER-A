<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc"><title id="title">Atlas de separadores, portaagujas y suturas</title><desc id="desc">Lámina educativa con separadores, portaagujas, agujas y clasificación de suturas.</desc><defs><style>.bg{fill:#f5f8f7}.panel{fill:#fff;stroke:#d5e1dc;stroke-width:2}.h{font:700 34px Arial;fill:#173b32}.sub{font:16px Arial;fill:#526b63}.tag{font:700 19px Arial;fill:#176b57}.lbl{font:700 17px Arial;fill:#203d35}.small{font:14px Arial;fill:#536b64}.metal{fill:none;stroke:#718c91;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#718c91;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect class="bg" width="1500" height="1080"/><text x="55" y="65" class="h">ATLAS · EXPOSICIÓN Y CIERRE QUIRÚRGICO</text><text x="55" y="98" class="sub">Separadores · Portaagujas · Agujas y suturas | Esquemas educativos, no a escala</text>
