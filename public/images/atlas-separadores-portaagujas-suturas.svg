<g transform="translate(640 220)"><path d="M20 15 Q110 0 155 60 L135 95 Q85 65 20 55Z" fill="#718c91"/><text x="0" y="140" class="lbl">Deaver</text><text x="0" y="165" class="small">Manual · hoja curva profunda</text></g>
<g transform="translate(920 220)"><circle cx="35" cy="30" r="20" class="thin"/><circle cx="145" cy="30" r="20" class="thin"/><path d="M55 30 L90 85 L125 30" class="metal"/><path d="M80 85 L65 105 M100 85 L115 105" class="thin"/><text x="0" y="140" class="lbl">Weitlaner</text><text x="0" y="165" class="small">Autoestático · puntas dentadas</text></g>
