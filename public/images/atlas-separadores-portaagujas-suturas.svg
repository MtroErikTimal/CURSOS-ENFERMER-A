<g transform="translate(420 630)"><circle cx="35" cy="35" r="25" class="thin"/><circle cx="105" cy="35" r="25" class="thin"/><path d="M55 20 L150 -10 L230 -10 M85 20 L150 10 L230 10" class="metal"/><path d="M230 -10 L270 -15 M230 10 L270 15" class="thin"/><path d="M180 20 L215 45" stroke="#d7a45a" stroke-width="7"/><text x="0" y="115" class="lbl">Olsen-Hegar</text><text x="0" y="140" class="small">Integra tijeras para sutura</text></g>
