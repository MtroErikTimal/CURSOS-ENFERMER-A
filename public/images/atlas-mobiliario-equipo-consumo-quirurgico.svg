<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">Atlas de mobiliario, equipo y material de consumo quirúrgico</title><desc id="desc">Lámina educativa con mesa quirúrgica, lámpara, mesas auxiliares, estación de anestesia, monitor, electrocirugía, aspiración y consumibles.</desc><defs><style>.bg{fill:#f4f7f5}.panel{fill:#fff;stroke:#cbd8d1;stroke-width:3}.h{font:700 27px Arial,sans-serif;fill:#174c3d}.t{font:20px Arial,sans-serif;fill:#243b33}.s{font:17px Arial,sans-serif;fill:#4b6258}.line{stroke:#315f50;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#567c6b;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.metal{fill:#dce6e1;stroke:#426b5b;stroke-width:5}.dark{fill:#24483b}.accent{fill:#b9d8c9;stroke:#426b5b;stroke-width:4}.gold{fill:#f4d99a;stroke:#8b6c30;stroke-width:4}.blue{fill:#d8e9f2;stroke:#4d748a;stroke-width:4}.red{fill:#f5d7d4;stroke:#a65d55;stroke-width:4}</style></defs><rect class="bg" width="1600" height="1100"/><rect x="38" y="30" width="1524" height="1040" rx="28" fill="#e7efe9"/><text x="800" y="88" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700" fill="#174c3d">MOBILIARIO, EQUIPO Y MATERIAL DE CONSUMO</text><text x="800" y="124" text-anchor="middle" class="s">Sala de operaciones · esquema didáctico de reconocimiento funcional</text><rect class="panel" x="65" y="160" width="710" height="520" rx="22"/><text class="h" x="95" y="205">1. Mobiliario y posicionamiento</text><path class="line" d="M185 390 H645 M225 390 L205 545 M600 390 L625 545 M205 545 H250 M590 545 H640"/><rect class="metal" x="185" y="340" width="460" height="52" rx="18"/><rect class="accent" x="225" y="315" width="140" height="30" rx="12"/><rect class="accent" x="370" y="315" width="130" height="30" rx="12"/><rect class="accent" x="505" y="315" width="100" height="30" rx="12"/><path class="thin" d="M250 392 V430 M580 392 V430"/><rect class="gold" x="215" y="430" width="80" height="20" rx="8"/><rect class="gold" x="535" y="430" width="80" height="20" rx="8"/><text class="t" x="410" y="270" text-anchor="middle">Mesa quirúrgica y secciones articuladas</text><path class="thin" d="M410 280 V305"/><text class="s" x="410" y="590" text-anchor="middle">Accesorios: apoyabrazos · soportes · perneras · colchón</text><path class="line" d="M690 240 V295 L650 315"/><ellipse class="gold" cx="620" cy="315" rx="68" ry="22"/><path class="thin" d="M575 315 L590 330 M610 315 L610 338 M645 315 L630 330"/><text class="s" x="625" y="365" text-anchor="middle">Lámpara quirúrgica</text><rect class="metal" x="105" y="485" width="115" height="18" rx="5"/><path class="line" d="M120 503 V565 M205 503 V565"/><text class="s" x="160" y="610" text-anchor="middle">Mesa de Mayo</text><rect class="metal" x="500" y="485" width="155" height="18" rx="5"/><path class="line" d="M520 503 V565 M635 503 V565"/><text class="s" x="575" y="610" text-anchor="middle">Mesa auxiliar</text><rect class="panel" x="805" y="160" width="730" height="520" rx="22"/><text class="h" x="835" y="205">2. Equipos de apoyo</text><rect class="blue" x="850" y="250" width="190" height="190" rx="18"/><rect class="dark" x="875" y="270" width="140" height="65" rx="10"/><path class="thin" d="M890 305 H920 L935 290 L950 318 L975 295 H1000"/><circle class="accent" cx="895" cy="370" r="17"/><circle class="accent" cx="955" cy="370" r="17"/><path class="line" d="M875 440 V485 M1015 440 V485"/><text class="t" x="945" y="520" text-anchor="middle">Estación de anestesia</text><text class="s" x="945" y="545" text-anchor="middle">Operación por personal autorizado</text><rect class="blue" x="1090" y="250" width="175" height="130" rx="14"/><rect class="dark" x="1105" y="265" width="145" height="95" rx="8"/><path stroke="#a9e0c6" stroke-width="4" fill="none" d="M1115 315 H1130 L1142 290 L1155 340 L1170 305 H1190 L1200 315 H1240"/><path class="line" d="M1175 380 V445 M1135 445 H1215"/><text class="t" x="1175" y="485" text-anchor="middle">Monitor</text><text class="s" x="1175" y="510" text-anchor="middle">ECG · SpO₂ · PA · capnografía</text><rect class="gold" x="1320" y="250" width="170" height="125" rx="16"/><rect class="dark" x="1340" y="270" width="130" height="38" rx="6"/><circle class="red" cx="1360" cy="340" r="12"/><circle class="accent" cx="1400" cy="340" r="12"/><path class="thin" d="M1450 375 C1450 420 1410 420 1410 455"/><text class="t" x="1405" y="485" text-anchor="middle">Electrocirugía</text><text class="s" x="1405" y="510" text-anchor="middle">Unidad + accesorios compatibles</text><rect class="blue" x="850" y="565" width="125" height="75" rx="12"/><path class="thin" d="M875 565 V535 H950 V565 M890 600 H935"/><text class="s" x="910" y="660" text-anchor="middle">Aspiración</text><path class="thin" d="M975 600 H1040"/><rect class="metal" x="1040" y="565" width="100" height="75" rx="12"/><text class="s" x="1090" y="660" text-anchor="middle">Bomba / soporte</text><text class="s" x="1300" y="590" text-anchor="middle">Verificar cables, conexiones, alarmas,</text><text class="s" x="1300" y="615" text-anchor="middle">accesorios, integridad y prueba preuso</text><rect class="panel" x="65" y="710" width="1470" height="315" rx="22"/><text class="h" x="95" y="755">3. Material de consumo y verificación</text><g transform="translate(115 795)"><rect class="blue" width="145" height="110" rx="12"/><path class="thin" d="M15 20 H130 M15 90 H130 M72 0 V110"/><text class="s" x="72" y="140" text-anchor="middle">Campos y batas</text></g><g transform="translate(320 795)"><rect class="accent" width="145" height="110" rx="12"/><path class="thin" d="M25 25 Q72 -5 120 25 L110 85 Q72 105 35 85 Z"/><text class="s" x="72" y="140" text-anchor="middle">Guantes estériles</text></g><g transform="translate(525 795)"><rect class="gold" width="145" height="110" rx="12"/><path class="thin" d="M30 25 L115 25 L115 85 L30 85 Z M40 40 H105 M40 55 H105 M40 70 H105"/><text class="s" x="72" y="140" text-anchor="middle">Gasas y compresas</text></g><g transform="translate(730 795)"><rect class="red" width="145" height="110" rx="12"/><path class="thin" d="M30 70 L105 25 M30 25 L105 70 M72 15 V95"/><text class="s" x="72" y="140" text-anchor="middle">Suturas y agujas</text></g><g transform="translate(935 795)"><rect class="blue" width="145" height="110" rx="12"/><path class="thin" d="M45 15 V90 Q45 100 60 100 H90 Q105 100 105 90 V15 M45 35 H105"/><text class="s" x="72" y="140" text-anchor="middle">Sondas y drenajes</text></g><g transform="translate(1140 795)"><rect class="gold" width="145" height="110" rx="12"/><path class="thin" d="M55 15 H90 V35 L105 55 V90 H40 V55 L55 35 Z"/><text class="s" x="72" y="140" text-anchor="middle">Soluciones y envases</text></g><g transform="translate(1345 795)"><rect class="red" width="145" height="110" rx="12"/><path class="thin" d="M45 20 H100 V95 H45 Z M40 20 H105 M55 45 H90 M55 60 H90"/><text class="s" x="72" y="140" text-anchor="middle">Punzocortantes</text></g><text class="t" x="800" y="990" text-anchor="middle">Antes de abrir o utilizar: identidad · compatibilidad · integridad · vigencia · lote · indicadores cuando apliquen</text></svg>