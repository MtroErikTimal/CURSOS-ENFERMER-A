<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Estructura conceptual del expediente clínico</title><desc id="d">Diagrama de un expediente central relacionado con identificación, historia clínica, notas de evolución, hoja de enfermería, estudios y consentimiento, protegido por confidencialidad.</desc><rect width="1200" height="760" rx="28" fill="#f4f7f2"/><text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#176b57">EXPEDIENTE CLÍNICO</text><text x="600" y="108" text-anchor="middle" font-family="Arial" font-size="18" fill="#53675b">Conjunto único de información y datos personales</text><rect x="420" y="290" width="360" height="150" rx="18" fill="#176b57"/><text x="600" y="350" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">Atención integral</text><text x="600" y="388" text-anchor="middle" font-family="Arial" font-size="19" fill="#e8f4eb">Continuidad · Comunicación · Calidad</text><g stroke="#9ab7a1" stroke-width="5" fill="none"><path d="M420 330 L270 230"/><path d="M780 330 L930 230"/><path d="M420 400 L270 530"/><path d="M780 400 L930 530"/><path d="M600 440 L600 570"/></g><g font-family="Arial" text-anchor="middle"><rect x="80" y="155" width="300" height="110" rx="14" fill="#fff" stroke="#c8d9ca" stroke-width="3"/><text x="230" y="200" font-size="22" font-weight="700" fill="#244436">Identificación</text><text x="230" y="232" font-size="17" fill="#5b7063">Datos generales</text><rect x="820" y="155" width="300" height="110" rx="14" fill="#fff" stroke="#c8d9ca" stroke-width="3"/><text x="970" y="200" font-size="22" font-weight="700" fill="#244436">Historia clínica</text><text x="970" y="232" font-size="17" fill="#5b7063">Valoración y antecedentes</text><rect x="80" y="490" width="300" height="110" rx="14" fill="#fff" stroke="#c8d9ca" stroke-width="3"/><text x="230" y="535" font-size="22" font-weight="700" fill="#244436">Notas y evolución</text><text x="230" y="567" font-size="17" fill="#5b7063">Seguimiento clínico</text><rect x="820" y="490" width="300" height="110" rx="14" fill="#fff" stroke="#c8d9ca" stroke-width="3"/><text x="970" y="535" font-size="22" font-weight="700" fill="#244436">Hoja de enfermería</text><text x="970" y="567" font-size="17" fill="#5b7063">Registros del numeral 9.1</text><rect x="390" y="585" width="420" height="95" rx="14" fill="#e4eee4" stroke="#b9d0bc" stroke-width="3"/><text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#244436">Estudios · Consentimientos</text><text x="600" y="654" text-anchor="middle" font-family="Arial" font-size="17" fill="#5b7063">Otros documentos pertinentes</text><text x="600" y="725" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#176b57">Confidencialidad y manejo responsable de la información</text></g></svg>