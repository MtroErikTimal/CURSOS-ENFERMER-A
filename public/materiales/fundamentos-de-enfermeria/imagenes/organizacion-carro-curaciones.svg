<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Organización segura del carro de curaciones</title><desc id="desc">Infografía esquemática con zonas limpias, material protegido, separación de residuos y lista de verificación.</desc><rect width="1200" height="900" rx="30" fill="#f6f7f2"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#176b57">FUNDAMENTOS DE ENFERMERÍA I · UNIDAD 2</text><text x="70" y="145" font-family="Georgia,serif" font-size="52" font-weight="700" fill="#20372c">Carro de curaciones</text><text x="70" y="190" font-family="Arial,sans-serif" font-size="24" fill="#596b60">Organización por zonas para prevenir contaminación cruzada</text>
<g transform="translate(90 250)"><rect x="30" y="0" width="650" height="390" rx="24" fill="#e2eae2" stroke="#9db6a4" stroke-width="5"/><rect x="55" y="25" width="600" height="125" rx="15" fill="#fff" stroke="#176b57" stroke-width="4"/><text x="80" y="65" font-family="Arial" font-size="25" font-weight="700" fill="#176b57">SUPERFICIE LIMPIA</text><g fill="#dceee2" stroke="#6d9b7b" stroke-width="3"><rect x="80" y="85" width="150" height="48" rx="8"/><rect x="250" y="85" width="150" height="48" rx="8"/><rect x="420" y="85" width="200" height="48" rx="8"/></g><g font-family="Arial" font-size="18" fill="#244d37" text-anchor="middle"><text x="155" y="116">Material</text><text x="325" y="116">Instrumental</text><text x="520" y="116">Soluciones*</text></g><rect x="55" y="170" width="285" height="105" rx="13" fill="#fff" stroke="#7d9f86" stroke-width="3"/><rect x="355" y="170" width="300" height="105" rx="13" fill="#fff" stroke="#7d9f86" stroke-width="3"/><text x="80" y="210" font-family="Arial" font-size="23" font-weight="700" fill="#176b57">CAJONES</text><text x="80" y="244" font-family="Arial" font-size="18" fill="#596b60">Insumos protegidos</text><text x="380" y="210" font-family="Arial" font-size="23" font-weight="700" fill="#176b57">COMPARTIMENTOS</text><text x="380" y="244" font-family="Arial" font-size="18" fill="#596b60">Categorías separadas</text><rect x="55" y="295" width="600" height="65" rx="12" fill="#f9e8d9" stroke="#bd8252" stroke-width="3"/><text x="355" y="336" font-family="Arial" font-size="21" font-weight="700" text-anchor="middle" fill="#86532e">No colocar material usado ni residuos en el carro</text><path d="M80 390h600" stroke="#789184" stroke-width="10" stroke-linecap="round"/><path d="M120 390v35m470-35v35" stroke="#789184" stroke-width="9"/><circle cx="120" cy="445" r="25" fill="#52675b"/><circle cx="590" cy="445" r="25" fill="#52675b"/></g>
<g transform="translate(800 255)" font-family="Arial,sans-serif"><text x="0" y="0" font-size="27" font-weight="700" fill="#176b57">PUNTO DE ATENCIÓN</text><rect x="0" y="25" width="310" height="125" rx="16" fill="#fff" stroke="#d3dfd5" stroke-width="3"/><text x="22" y="65" font-size="22" font-weight="700" fill="#244d37">Residuos</text><text x="22" y="100" font-size="18" fill="#596b60">Recipiente apropiado</text><text x="22" y="128" font-size="18" fill="#596b60">fuera de la zona limpia</text><rect x="0" y="170" width="310" height="125" rx="16" fill="#fff" stroke="#d3dfd5" stroke-width="3"/><text x="22" y="210" font-size="22" font-weight="700" fill="#244d37">Punzocortantes</text><text x="22" y="245" font-size="18" fill="#596b60">Contenedor rígido</text><text x="22" y="273" font-size="18" fill="#596b60">autorizado y cercano</text><rect x="0" y="315" width="310" height="125" rx="16" fill="#e5efe7" stroke="#8eaf98" stroke-width="3"/><text x="22" y="355" font-size="22" font-weight="700" fill="#244d37">Pinza de traslado</text><text x="22" y="390" font-size="18" fill="#596b60">Verificar procesamiento</text><text x="22" y="418" font-size="18" fill="#596b60">y protocolo institucional</text></g>
<rect x="70" y="735" width="1060" height="105" rx="20" fill="#e5efe7"/><text x="100" y="778" font-family="Arial" font-size="24" font-weight="700" fill="#176b57">ANTES DE USAR: verifica limpieza · empaque íntegro · caducidad · identificación · indicadores</text><text x="100" y="815" font-family="Arial" font-size="19" fill="#596b60">* Soluciones y medicamentos solo si el servicio los autoriza y se controlan según protocolo.</text><text x="70" y="875" font-family="Arial" font-size="16" fill="#718177">Esquema didáctico: la distribución real depende del servicio y de sus procedimientos autorizados.</text></svg>