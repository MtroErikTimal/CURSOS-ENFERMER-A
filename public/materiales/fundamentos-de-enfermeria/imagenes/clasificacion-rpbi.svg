<text x="100" y="195" font-family="Georgia,serif" font-size="58" font-weight="700" fill="#20372c">Clasificación de RPBI</text>
<text x="100" y="245" font-family="Arial,sans-serif" font-size="25" fill="#596b60">Guía visual de las cinco categorías y su envasado normativo</text>
