<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Seis parámetros de valoración</title><desc id="desc">Infografía de los seis parámetros estudiados en la unidad de signos vitales y su fundamento fisiológico.</desc>
<rect width="1200" height="900" rx="34" fill="#f6f7f2"/>
<rect x="42" y="38" width="1116" height="160" rx="28" fill="#143f35"/>
<text x="82" y="88" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#bfe1d3" letter-spacing="4">FUNDAMENTOS DE ENFERMERÍA I</text>
<text x="82" y="145" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#ffffff">Signos vitales</text>
<text x="84" y="178" font-family="Arial,sans-serif" font-size="21" fill="#e3f0e9">Medir · interpretar · actuar · registrar</text>
<g font-family="Arial,sans-serif">
<g transform="translate(42 230)"><rect width="350" height="250" rx="22" fill="#ffffff" stroke="#dce5df" stroke-width="3"/><circle cx="58" cy="58" r="31" fill="#eaf2ed"/><path d="M58 36v44M43 58h30" stroke="#176b57" stroke-width="7" stroke-linecap="round"/><text x="105" y="53" font-size="29" font-weight="700" fill="#176b57">Temperatura</text><text x="28" y="118" font-size="21" fill="#18332d"><tspan x="28" dy="0">Balance entre termogénesis</tspan><tspan x="28" dy="31">y termólisis.</tspan></text><text x="28" y="205" font-size="18" fill="#52645e">Regulación: hipotálamo</text></g>
<g transform="translate(425 230)"><rect width="350" height="250" rx="22" fill="#ffffff" stroke="#dce5df" stroke-width="3"/><circle cx="58" cy="58" r="31" fill="#eaf2ed"/><path d="M35 62h16l9-22 12 39 10-17h14" fill="none" stroke="#176b57" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="105" y="53" font-size="29" font-weight="700" fill="#176b57">Pulso / FC</text><text x="28" y="118" font-size="21" fill="#18332d"><tspan x="28" dy="0">Actividad cardiaca y onda</tspan><tspan x="28" dy="31">de presión arterial.</tspan></text><text x="28" y="205" font-size="18" fill="#52645e">Regulación: SNA y barorreflejo</text></g>
<g transform="translate(808 230)"><rect width="350" height="250" rx="22" fill="#ffffff" stroke="#dce5df" stroke-width="3"/><circle cx="58" cy="58" r="31" fill="#eaf2ed"/><path d="M58 34v18c-19-17-31-2-25 17 5 15 17 18 25 3 8 15 20 12 25-3 6-19-6-34-25-17" fill="none" stroke="#176b57" stroke-width="5" stroke-linecap="round"/><text x="105" y="53" font-size="29" font-weight="700" fill="#176b57">Respiración</text><text x="28" y="118" font-size="21" fill="#18332d"><tspan x="28" dy="0">Ventilación, intercambio</tspan><tspan x="28" dy="31">gaseoso y patrón.</tspan></text><text x="28" y="205" font-size="18" fill="#52645e">Regulación: tronco encefálico</text></g>
<g transform="translate(42 515)"><rect width="350" height="250" rx="22" fill="#ffffff" stroke="#dce5df" stroke-width="3"/><circle cx="58" cy="58" r="31" fill="#eaf2ed"/><path d="M37 66h42M42 55h32M48 44h20" stroke="#176b57" stroke-width="6" stroke-linecap="round"/><text x="105" y="53" font-size="29" font-weight="700" fill="#176b57">Presión arterial</text><text x="28" y="118" font-size="21" fill="#18332d"><tspan x="28" dy="0">Gasto cardiaco y resistencia</tspan><tspan x="28" dy="31">vascular sistémica.</tspan></text><text x="28" y="205" font-size="18" fill="#52645e">Regulación: riñón y barorreceptores</text></g>
<g transform="translate(425 515)"><rect width="350" height="250" rx="22" fill="#ffffff" stroke="#dce5df" stroke-width="3"/><circle cx="58" cy="58" r="31" fill="#eaf2ed"/><path d="M58 34c-12 0-21 9-21 22s9 22 21 22 21-9 21-22-9-22-21-22z" fill="none" stroke="#176b57" stroke-width="5"/><path d="M44 57h28" stroke="#176b57" stroke-width="5"/><text x="105" y="53" font-size="29" font-weight="700" fill="#176b57">SpO₂</text><text x="28" y="118" font-size="21" fill="#18332d"><tspan x="28" dy="0">Estimación de hemoglobina</tspan><tspan x="28" dy="31">saturada con oxígeno.</tspan></text><text x="28" y="205" font-size="18" fill="#52645e">No mide PaCO₂ ni ventilación</text></g>
<g transform="translate(808 515)"><rect width="350" height="250" rx="22" fill="#ffffff" stroke="#dce5df" stroke-width="3"/><circle cx="58" cy="58" r="31" fill="#eaf2ed"/><path d="M58 35c-16-18-38 4-21 22l21 20 21-20c17-18-5-40-21-22z" fill="none" stroke="#176b57" stroke-width="5"/><text x="105" y="53" font-size="29" font-weight="700" fill="#176b57">Dolor</text><text x="28" y="118" font-size="21" fill="#18332d"><tspan x="28" dy="0">Experiencia sensorial y</tspan><tspan x="28" dy="31">emocional personal.</tspan></text><text x="28" y="205" font-size="18" fill="#52645e">Valorar con escala apropiada</text></g>
</g>
<text x="600" y="835" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#52645e">La cifra aislada no sustituye la valoración clínica integral.</text>
</svg>