<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450" role="img" aria-labelledby="t d"><title id="t">Secuencia segura de limpieza y desinfección</title><desc id="d">Infografía con siete pasos para la higiene ambiental hospitalaria.</desc><rect width="1200" height="1450" fill="#f6f7f2"/><rect x="55" y="45" width="1090" height="1360" rx="34" fill="#fff" stroke="#dce7df" stroke-width="3"/><text x="100" y="125" font-family="Arial" font-size="27" font-weight="700" letter-spacing="4" fill="#176b57">FUNDAMENTOS DE ENFERMERÍA I</text><text x="100" y="205" font-family="Georgia" font-size="57" font-weight="700" fill="#20372c">Limpieza y desinfección</text><text x="100" y="255" font-family="Arial" font-size="24" fill="#596b60">Secuencia general para un entorno asistencial seguro</text>
<g font-family="Arial"><g><rect x="105" y="315" width="990" height="115" rx="18" fill="#eaf3ec"/><circle cx="165" cy="372" r="35" fill="#176b57"/><text x="165" y="383" fill="white" font-size="31" text-anchor="middle" font-weight="700">1</text><text x="225" y="360" fill="#20372c" font-size="29" font-weight="700">Evalúa el área y el riesgo</text><text x="225" y="399" fill="#596b60" font-size="21">Consulta procedimiento, superficie, equipo y producto autorizado.</text></g><g><rect x="105" y="455" width="990" height="115" rx="18" fill="#f4f7f3"/><circle cx="165" cy="512" r="35" fill="#176b57"/><text x="165" y="523" fill="white" font-size="31" text-anchor="middle" font-weight="700">2</text><text x="225" y="500" fill="#20372c" font-size="29" font-weight="700">Prepara y señaliza</text><text x="225" y="539" fill="#596b60" font-size="21">Organiza materiales y utiliza el EPP indicado.</text></g><g><rect x="105" y="595" width="990" height="115" rx="18" fill="#eaf3ec"/><circle cx="165" cy="652" r="35" fill="#176b57"/><text x="165" y="663" fill="white" font-size="31" text-anchor="middle" font-weight="700">3</text><text x="225" y="640" fill="#20372c" font-size="29" font-weight="700">Retira residuos de forma segura</text><text x="225" y="679" fill="#596b60" font-size="21">Respeta su clasificación y evita manipulación innecesaria.</text></g><g><rect x="105" y="735" width="990" height="115" rx="18" fill="#f4f7f3"/><circle cx="165" cy="792" r="35" fill="#176b57"/><text x="165" y="803" fill="white" font-size="31" text-anchor="middle" font-weight="700">4</text><text x="225" y="780" fill="#20372c" font-size="29" font-weight="700">Limpia primero</text><text x="225" y="819" fill="#596b60" font-size="21">Detergente y acción mecánica para remover suciedad y materia orgánica.</text></g><g><rect x="105" y="875" width="990" height="115" rx="18" fill="#eaf3ec"/><circle cx="165" cy="932" r="35" fill="#176b57"/><text x="165" y="943" fill="white" font-size="31" text-anchor="middle" font-weight="700">5</text><text x="225" y="920" fill="#20372c" font-size="29" font-weight="700">Desinfecta según indicación</text><text x="225" y="959" fill="#596b60" font-size="21">Usa concentración y tiempo de contacto de etiqueta/protocolo.</text></g><g><rect x="105" y="1015" width="990" height="115" rx="18" fill="#f4f7f3"/><circle cx="165" cy="1072" r="35" fill="#176b57"/><text x="165" y="1083" fill="white" font-size="31" text-anchor="middle" font-weight="700">6</text><text x="225" y="1060" fill="#20372c" font-size="29" font-weight="700">Evita la contaminación cruzada</text><text x="225" y="1099" fill="#596b60" font-size="21">Cambia paños, avanza de limpio a sucio y no recontamines superficies.</text></g><g><rect x="105" y="1155" width="990" height="115" rx="18" fill="#eaf3ec"/><circle cx="165" cy="1212" r="35" fill="#176b57"/><text x="165" y="1223" fill="white" font-size="31" text-anchor="middle" font-weight="700">7</text><text x="225" y="1200" fill="#20372c" font-size="29" font-weight="700">Finaliza y registra</text><text x="225" y="1239" fill="#596b60" font-size="21">Retira EPP con seguridad, higiene de manos y documentación requerida.</text></g></g><rect x="105" y="1300" width="990" height="65" rx="15" fill="#176b57"/><text x="600" y="1342" font-family="Arial" font-size="25" text-anchor="middle" fill="white" font-weight="700">LIMPIEZA ANTES DE DESINFECCIÓN · NUNCA MEZCLES QUÍMICOS</text><text x="100" y="1390" font-family="Arial" font-size="15" fill="#68776e">Material didáctico. Aplicar el procedimiento institucional y las instrucciones del fabricante.</text></svg>