<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Los cinco momentos para la higiene de manos</title><desc id="desc">Infografía educativa con cinco momentos para realizar higiene de manos en la atención sanitaria.</desc>
<rect width="1200" height="900" rx="34" fill="#f6f7f2"/><text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#176b57">LOS 5 MOMENTOS DE HIGIENE DE MANOS</text><text x="600" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#52685b">Una barrera esencial para prevenir la transmisión de microorganismos</text>
<circle cx="600" cy="485" r="205" fill="#e4eee6" stroke="#176b57" stroke-width="4"/><rect x="475" y="405" width="250" height="150" rx="20" fill="#fff" stroke="#a9c6b2" stroke-width="4"/><rect x="500" y="430" width="200" height="80" rx="12" fill="#dcebe0"/><circle cx="555" cy="470" r="24" fill="#176b57"/><path d="M580 470h75" stroke="#176b57" stroke-width="12" stroke-linecap="round"/><text x="600" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#244b39">PERSONA ATENDIDA</text>
<g font-family="Arial,sans-serif"><g><rect x="60" y="210" width="360" height="130" rx="18" fill="#fff" stroke="#cbded0" stroke-width="3"/><circle cx="112" cy="275" r="34" fill="#176b57"/><text x="112" y="286" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">1</text><text x="165" y="260" font-size="23" font-weight="700" fill="#244b39">ANTES DE TOCAR</text><text x="165" y="292" font-size="20" fill="#52685b">a la persona</text></g>
<g><rect x="420" y="155" width="360" height="130" rx="18" fill="#fff" stroke="#cbded0" stroke-width="3"/><circle cx="472" cy="220" r="34" fill="#176b57"/><text x="472" y="231" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">2</text><text x="525" y="205" font-size="22" font-weight="700" fill="#244b39">ANTES DE TAREA</text><text x="525" y="237" font-size="20" fill="#52685b">limpia o aséptica</text></g>
<g><rect x="780" y="210" width="360" height="130" rx="18" fill="#fff" stroke="#cbded0" stroke-width="3"/><circle cx="832" cy="275" r="34" fill="#176b57"/><text x="832" y="286" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">3</text><text x="885" y="254" font-size="20" font-weight="700" fill="#244b39">DESPUÉS DEL RIESGO</text><text x="885" y="286" font-size="19" fill="#52685b">de fluidos corporales</text></g>
<g><rect x="780" y="675" width="360" height="130" rx="18" fill="#fff" stroke="#cbded0" stroke-width="3"/><circle cx="832" cy="740" r="34" fill="#176b57"/><text x="832" y="751" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">4</text><text x="885" y="728" font-size="22" font-weight="700" fill="#244b39">DESPUÉS DE TOCAR</text><text x="885" y="760" font-size="20" fill="#52685b">a la persona</text></g>
<g><rect x="60" y="675" width="360" height="130" rx="18" fill="#fff" stroke="#cbded0" stroke-width="3"/><circle cx="112" cy="740" r="34" fill="#176b57"/><text x="112" y="751" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">5</text><text x="165" y="720" font-size="20" font-weight="700" fill="#244b39">DESPUÉS DEL ENTORNO</text><text x="165" y="752" font-size="20" fill="#52685b">inmediato de la persona</text></g></g>
<text x="600" y="860" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52685b">Los guantes no sustituyen la higiene de manos. Sigue el protocolo institucional.</text></svg>