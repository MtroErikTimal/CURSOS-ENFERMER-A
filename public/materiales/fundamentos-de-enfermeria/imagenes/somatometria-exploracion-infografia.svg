<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Somatometría y exploración física</title><desc id="d">Infografía sobre mediciones corporales, fórmula del índice de masa corporal y cuatro técnicas de exploración física.</desc><rect width="1200" height="760" rx="28" fill="#f6f7f2"/><text x="60" y="82" font-family="Arial" font-size="42" font-weight="700" fill="#176b57">Somatometría y exploración física</text><text x="60" y="124" font-family="Arial" font-size="22" fill="#52645b">Medir con técnica, explorar con método y registrar con precisión</text><g font-family="Arial"><rect x="60" y="170" width="500" height="220" rx="22" fill="#fff" stroke="#dce5df" stroke-width="3"/><text x="92" y="220" font-size="30" font-weight="700" fill="#176b57">Somatometría</text><text x="92" y="270" font-size="24" fill="#20312d">⚖ Peso · kg</text><text x="92" y="315" font-size="24" fill="#20312d">↕ Talla · cm o m</text><text x="92" y="360" font-size="24" fill="#20312d">◎ Perímetros · cm</text><rect x="600" y="170" width="540" height="220" rx="22" fill="#e6f0e9"/><text x="635" y="220" font-size="30" font-weight="700" fill="#176b57">Índice de masa corporal</text><text x="635" y="278" font-size="31" font-weight="700" fill="#20312d">IMC = kg ÷ m²</text><text x="635" y="326" font-size="21" fill="#52645b">Indicador de tamizaje, no diagnóstico aislado.</text><text x="635" y="360" font-size="19" fill="#52645b">Interpretar según edad, condición y guía aplicable.</text><text x="60" y="455" font-size="30" font-weight="700" fill="#176b57">Cuatro técnicas de exploración</text><g><rect x="60" y="490" width="250" height="180" rx="18" fill="#fff" stroke="#dce5df" stroke-width="2"/><text x="88" y="540" font-size="27" font-weight="700" fill="#176b57">1. Inspección</text><text x="88" y="585" font-size="21" fill="#20312d">Observar</text><text x="88" y="620" font-size="18" fill="#52645b">Color, forma, simetría</text><rect x="340" y="490" width="250" height="180" rx="18" fill="#fff" stroke="#dce5df" stroke-width="2"/><text x="368" y="540" font-size="27" font-weight="700" fill="#176b57">2. Palpación</text><text x="368" y="585" font-size="21" fill="#20312d">Tocar</text><text x="368" y="620" font-size="18" fill="#52645b">Textura, dolor, temperatura</text><rect x="620" y="490" width="250" height="180" rx="18" fill="#fff" stroke="#dce5df" stroke-width="2"/><text x="648" y="540" font-size="27" font-weight="700" fill="#176b57">3. Percusión</text><text x="648" y="585" font-size="21" fill="#20312d">Percutir</text><text x="648" y="620" font-size="18" fill="#52645b">Interpretar sonidos</text><rect x="900" y="490" width="240" height="180" rx="18" fill="#fff" stroke="#dce5df" stroke-width="2"/><text x="928" y="540" font-size="27" font-weight="700" fill="#176b57">4. Auscultación</text><text x="928" y="585" font-size="21" fill="#20312d">Escuchar</text><text x="928" y="620" font-size="18" fill="#52645b">Ruidos con estetoscopio</text></g><text x="60" y="720" font-size="18" fill="#52645b">Abdomen: inspección → auscultación → percusión → palpación.</text></g></svg>