<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Admisión, estancia y egreso hospitalario</title><desc id="d">Ruta didáctica en tres fases: admisión, estancia y egreso.</desc><rect width="1200" height="720" rx="28" fill="#f6f7f2"/><text x="60" y="82" font-family="Arial" font-size="42" font-weight="700" fill="#176b57">Continuidad del cuidado hospitalario</text><text x="60" y="125" font-family="Arial" font-size="22" fill="#52645b">Tres momentos conectados por comunicación, seguridad y registro</text><g font-family="Arial"><rect x="60" y="190" width="320" height="360" rx="24" fill="#fff" stroke="#dce5df" stroke-width="3"/><circle cx="220" cy="260" r="48" fill="#e6f0e9"/><text x="220" y="276" text-anchor="middle" font-size="44" font-weight="700" fill="#176b57">1</text><text x="95" y="350" font-size="30" font-weight="700" fill="#176b57">Admisión</text><text x="95" y="400" font-size="21" fill="#20312d">• Identifica</text><text x="95" y="440" font-size="21" fill="#20312d">• Valora riesgos</text><text x="95" y="480" font-size="21" fill="#20312d">• Orienta y registra</text><rect x="440" y="190" width="320" height="360" rx="24" fill="#fff" stroke="#dce5df" stroke-width="3"/><circle cx="600" cy="260" r="48" fill="#e6f0e9"/><text x="600" y="276" text-anchor="middle" font-size="44" font-weight="700" fill="#176b57">2</text><text x="475" y="350" font-size="30" font-weight="700" fill="#176b57">Estancia</text><text x="475" y="400" font-size="21" fill="#20312d">• Cuida y reevalúa</text><text x="475" y="440" font-size="21" fill="#20312d">• Comunica cambios</text><text x="475" y="480" font-size="21" fill="#20312d">• Documenta</text><rect x="820" y="190" width="320" height="360" rx="24" fill="#fff" stroke="#dce5df" stroke-width="3"/><circle cx="980" cy="260" r="48" fill="#e6f0e9"/><text x="980" y="276" text-anchor="middle" font-size="44" font-weight="700" fill="#176b57">3</text><text x="855" y="350" font-size="30" font-weight="700" fill="#176b57">Egreso</text><text x="855" y="400" font-size="21" fill="#20312d">• Educa y verifica</text><text x="855" y="440" font-size="21" fill="#20312d">• Planifica seguimiento</text><text x="855" y="480" font-size="21" fill="#20312d">• Registra y coordina</text><path d="M385 360 H430 M420 350 L430 360 L420 370 M765 360 H810 M800 350 L810 360 L800 370" fill="none" stroke="#176b57" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="170" y="600" width="860" height="65" rx="18" fill="#e6f0e9"/><text x="600" y="642" text-anchor="middle" font-size="24" font-weight="700" fill="#176b57">Seguridad · Comunicación · Continuidad · Registro</text></g></svg>