<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Principios de mecánica corporal</title><desc id="d">Infografía educativa sobre base de sustentación, alineación, proximidad, giro con los pies y ayudas mecánicas.</desc><rect width="1200" height="900" rx="36" fill="#f6f7f2"/><rect x="40" y="35" width="1120" height="145" rx="26" fill="#176b57"/><text x="85" y="95" fill="white" font-family="Arial,sans-serif" font-size="26" font-weight="bold">FUNDAMENTOS DE ENFERMERÍA I · UNIDAD 2</text><text x="85" y="145" fill="white" font-family="Arial,sans-serif" font-size="46" font-weight="bold">MECÁNICA CORPORAL</text>
<g font-family="Arial,sans-serif" fill="#20312c"><g transform="translate(65 230)"><rect width="510" height="245" rx="24" fill="white"/><circle cx="110" cy="75" r="27" fill="#d5a77b"/><path d="M110 105 L110 185 M110 125 L65 155 M110 125 L155 155 M110 185 L75 220 M110 185 L145 220" stroke="#176b57" stroke-width="17" stroke-linecap="round" fill="none"/><path d="M48 226 L170 226" stroke="#c28a43" stroke-width="7" stroke-linecap="round"/><text x="205" y="65" font-size="28" font-weight="bold" fill="#176b57">1. Base estable</text><text x="205" y="110" font-size="22"><tspan x="205" dy="0">Separa los pies y distribuye</tspan><tspan x="205" dy="31">el peso de forma equilibrada.</tspan></text><text x="205" y="195" font-size="18" fill="#52635b">Evita trabajar sobre una base estrecha.</text></g>
<g transform="translate(625 230)"><rect width="510" height="245" rx="24" fill="white"/><circle cx="100" cy="67" r="25" fill="#d5a77b"/><path d="M100 95 L100 185 M100 115 L58 150 M100 115 L142 150 M100 185 L68 220 M100 185 L132 220" stroke="#176b57" stroke-width="16" stroke-linecap="round" fill="none"/><path d="M75 112 L125 112" stroke="#c28a43" stroke-width="5"/><text x="190" y="65" font-size="28" font-weight="bold" fill="#176b57">2. Alineación</text><text x="190" y="110" font-size="22"><tspan x="190" dy="0">Mantén columna neutra,</tspan><tspan x="190" dy="31">hombros relajados y articulaciones</tspan><tspan x="190" dy="31">en posición funcional.</tspan></text></g>
<g transform="translate(65 510)"><rect width="510" height="245" rx="24" fill="white"/><circle cx="90" cy="72" r="24" fill="#d5a77b"/><path d="M90 100 L90 185 M90 125 L55 155 M90 125 L130 155 M90 185 L60 220 M90 185 L120 220" stroke="#176b57" stroke-width="16" stroke-linecap="round" fill="none"/><rect x="145" y="135" width="55" height="65" rx="8" fill="#d9e8df" stroke="#176b57" stroke-width="4"/><path d="M125 150 L145 150" stroke="#c28a43" stroke-width="6"/><text x="225" y="65" font-size="28" font-weight="bold" fill="#176b57">3. Acércate</text><text x="225" y="110" font-size="22"><tspan x="225" dy="0">Mantén la tarea cerca del cuerpo</tspan><tspan x="225" dy="31">y evita brazos extendidos.</tspan></text><text x="225" y="195" font-size="18" fill="#52635b">No significa levantar a pulso a la persona.</text></g>
<g transform="translate(625 510)"><rect width="510" height="245" rx="24" fill="white"/><path d="M55 175 L120 175 M85 175 L85 120 M85 120 L55 100 M85 120 L115 100" stroke="#176b57" stroke-width="15" stroke-linecap="round" fill="none"/><path d="M45 205 Q85 235 130 205" stroke="#c28a43" stroke-width="6" fill="none"/><text x="170" y="65" font-size="28" font-weight="bold" fill="#176b57">4. Gira con los pies</text><text x="170" y="110" font-size="22"><tspan x="170" dy="0">Evita torsionar el tronco;</tspan><tspan x="170" dy="31">cambia de dirección moviendo</tspan><tspan x="170" dy="31">los pies y el cuerpo como unidad.</tspan></text></g></g>
<rect x="65" y="790" width="1070" height="70" rx="18" fill="#e5eee8"/><text x="95" y="835" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#176b57">5. Valora y utiliza ayudas mecánicas: sábana deslizante, tabla o grúa según el riesgo.</text></svg>