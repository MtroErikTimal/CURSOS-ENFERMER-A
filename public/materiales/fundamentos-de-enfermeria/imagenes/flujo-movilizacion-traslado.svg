<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" role="img" aria-labelledby="t d"><title id="t">Ruta segura para movilizar y trasladar</title><desc id="d">Diagrama de cinco pasos para valorar, planear, preparar, ejecutar y reevaluar una movilización.</desc><rect width="1000" height="1200" rx="30" fill="#f6f7f2"/><rect x="45" y="35" width="910" height="145" rx="24" fill="#176b57"/><text x="90" y="92" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="bold">FUNDAMENTOS DE ENFERMERÍA I</text><text x="90" y="145" fill="white" font-family="Arial,sans-serif" font-size="43" font-weight="bold">MOVILIZACIÓN SEGURA</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="170" y="230" width="660" height="135" rx="22" fill="#fff" stroke="#176b57" stroke-width="4"/><circle cx="230" cy="297" r="36" fill="#176b57"/><text x="230" y="309" font-size="34" fill="white" font-weight="bold">1</text><text x="535" y="285" font-size="30" fill="#176b57" font-weight="bold">VALORA</text><text x="535" y="326" font-size="21" fill="#20312c">Fuerza · equilibrio · dolor · mareo · dispositivos</text><path d="M500 365 V410" stroke="#b7791f" stroke-width="8" stroke-linecap="round"/><path d="M480 395 L500 415 L520 395" stroke="#b7791f" stroke-width="8" fill="none"/><rect x="170" y="430" width="660" height="135" rx="22" fill="#fff" stroke="#176b57" stroke-width="4"/><circle cx="230" cy="497" r="36" fill="#176b57"/><text x="230" y="509" font-size="34" fill="white" font-weight="bold">2</text><text x="535" y="485" font-size="30" fill="#176b57" font-weight="bold">PLANEA</text><text x="535" y="526" font-size="21" fill="#20312c">Objetivo · nivel de ayuda · roles · consentimiento</text><path d="M500 565 V610" stroke="#b7791f" stroke-width="8" stroke-linecap="round"/><path d="M480 595 L500 615 L520 595" stroke="#b7791f" stroke-width="8" fill="none"/><rect x="170" y="630" width="660" height="135" rx="22" fill="#fff" stroke="#176b57" stroke-width="4"/><circle cx="23