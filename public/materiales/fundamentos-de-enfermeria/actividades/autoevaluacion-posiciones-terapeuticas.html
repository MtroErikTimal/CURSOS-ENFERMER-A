<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autoevaluación · Posiciones terapéuticas</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f6f7f2;color:#20312d;margin:0}.wrap{max-width:850px;margin:auto;padding:24px}h1{color:#176b57}.q{background:#fff;border:1px solid #dce5df;border-radius:12px;padding:16px;margin:14px 0}label{display:block;margin:7px 0}button{background:#176b57;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:700}#result{font-weight:700;margin:18px 0}.feedback{font-size:.92rem;color:#52675e}</style></head><body><main class="wrap"><h1>Autoevaluación: posiciones terapéuticas</h1><p>Selecciona una respuesta por pregunta y pulsa Calificar.</p><form id="quiz"></form><button type="button" id="grade">Calificar</button><button type="button" id="reset" style="background:#60716b">Reiniciar</button><div id="result" aria-live="polite"></div></main><script>const qs=[['¿Qué caracteriza al decúbito supino?',['La persona está boca abajo','La persona está boca arriba','La persona está sentada','La persona está de lado'],1,'Supino significa acostado boca arriba.'],['¿Qué posición es semiprona y suele utilizarse para determinados enemas?',['Sims','Fowler alta','Trendelenburg','Litotomía'],0,'Sims es una variante lateral semiprona.'],['¿Cuál es el rango aproximado de semi-Fowler?',['0–10°','15–20°','30–45°','80–100°'],2,'Semi-Fowler suele situarse alrededor de 30–45°.'],['¿Qué posición puede aliviar disnea al permitir apoyo de brazos e inclinación anterior?',['Genupectoral','Ortopneica','Prona','Litotomía'],1,'La posición ortopneica facilita apoyo anterior y uso de músculos accesorios en algunas personas.'],['En Trendelenburg, ¿cómo queda la cabeza respecto a los pies?',['Más alta','Al mismo nivel','Más baja','No se inclina la cama'],2,'Trendelenburg inclina el plano con cabeza más baja que los pies.'],['¿Qué posición se utiliza en determinadas exploraciones ginecológicas?',['Litotomía','Prona','Sims','Anti-Trendelenburg'],0,'Litotomía coloca caderas y rodillas flexionadas con piernas sostenidas.'],['¿Qué debe hacerse antes de cambiar de posición a una persona?',['Moverla rápidamente','Valorar condición, riesgos y dispositivos','Retirar todos los apoyos','Ignorar dolor si coopera'],1,'La valoración previa orienta la posición y el nivel de ayuda.'],['¿Cuál es una medida para prevenir lesiones por presión?',['Mantener la misma posición','Colocar apoyo que distribuya presión y reevaluar piel','Apretar las correas','Evitar revisar prominencias óseas'],1,'La redistribución de presión y la reevaluación de piel son esenciales.'],['¿Trendelenburg debe usarse de rutina para tratar hipotensión o choque?',['Sí, siempre','No; requiere indicación específica y no es medida rutinaria','Solo en toda persona mayor','Sí, si hay mareo'],1,'No es una intervención rutinaria para tratar hipotensión o choque.'],['¿Qué debe registrarse después del posicionamiento?',['Solo el nombre de la posición','Motivo, posición, apoyos, tolerancia y respuesta','Solo la hora','Nada si no hubo incidentes'],1,'El registro permite continuidad y evaluación del cuidado.']];const form=document.getElementById('quiz');qs.forEach((q,i)=>{const d=document.createElement('section');d.className='q';d.innerHTML='<b>'+(i+1)+'. '+q[0]+'</b>'+q[1].map((a,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+a+'</label>').join('')+'<div class="feedback" id="f'+i+'"></div>';form.appendChild(d)});document.getElementById('grade').onclick=()=>{let score=0;qs.forEach((q,i)=>{const v=form.querySelector('input[name="q'+i+'"]:checked');const ok=v&&Number(v.value)===q[2];if(ok)score++;document.getElementById('f'+i).textContent=(ok?'Correcto. ':'Revisa. ')+q[3]});document.getElementById('result').textContent='Resultado: '+score+' de 10 ('+(score*10)+'%). '+(score>=9?'Dominio sobresaliente.':score>=7?'Buen avance; repasa los reactivos incorrectos.':'Conviene revisar la guía y volver a intentarlo.')};document.getElementById('reset').onclick=()=>{form.reset();qs.forEach((q,i)=>document.getElementById('f'+i).textContent='');document.getElementById('result').textContent=''};</script></body></html>
