<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autoevaluación: carro de curaciones</title><style>
:root{--g:#176b57;--ink:#20372c;--muted:#596b60;--line:#dce7df;--bg:#f6f7f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,sans-serif}.wrap{max-width:850px;margin:auto;padding:24px 16px 50px}.head,.question,.result{background:white;border:1px solid var(--line);border-radius:15px;padding:22px;margin:14px 0}.eyebrow{color:var(--g);font-size:12px;font-weight:800;letter-spacing:.12em}h1{font:34px/1.15 Georgia,serif;color:#214b39}h2{font-size:19px}.muted{color:var(--muted)}.option{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer}.option:has(input:checked){border-color:var(--g);background:#f0f6f1}.option input{margin-top:5px;accent-color:var(--g)}button{border:0;background:var(--g);color:white;padding:12px 18px;border-radius:9px;font-weight:700;font-size:15px}button.secondary{background:#e7eee8;color:#214b39}.feedback{margin-top:10px;padding:12px;border-radius:9px;background:#f0f6f1;color:#355c48}.wrong{background:#fff3e8;color:#81511d}.hidden{display:none}.score{font:42px Georgia,serif;color:var(--g)}.actions{display:flex;gap:10px;flex-wrap:wrap}
</style></head><body><main class="wrap"><header class="head"><p class="eyebrow">FUNDAMENTOS DE ENFERMERÍA I · UNIDAD 2</p><h1>Autoevaluación: carro de curaciones y pinza portaobjetos</h1><p class="muted">10 preguntas de opción múltiple. Selecciona una respuesta, revisa la retroalimentación y al final consulta tu resultado.</p><p id="progress" class="eyebrow">PREGUNTA 1 DE 10</p></header><section id="quiz"></section><section id="result" class="result hidden" aria-live="polite"></section></main><script>
const questions=[
{q:"¿Cuál es la finalidad principal del carro de curaciones?",o:["Sustituir el área de esterilización","Organizar y transportar material para procedimientos de curación","Almacenar residuos biológico-infecciosos","Mantener todos los materiales permanentemente estériles"],a:1,e:"El carro facilita organización y transporte. No esteriliza ni sustituye el reprocesamiento."},
{q:"¿Qué debe hacerse con un paquete de gasas cuyo empaque está abierto?",o:["Usarlo si las gasas parecen limpias","Guardarlo en otro cajón","Retirarlo y sustituirlo por material con empaque íntegro","Rociarlo con desinfectante"],a:2,e:"Un empaque abierto no garantiza esterilidad. No debe utilizarse ni reintegrarse al inventario."},
{q:"¿Cuál es una práctica correcta al organizar el carro?",o:["Separar material limpio/estéril del usado","Colocar residuos en el cajón inferior","Dejar soluciones sin identificación","Guardar material usado para la siguiente curación"],a:0,e:"La separación evita contaminación cruzada y protege las existencias."},
{q:"¿Qué se verifica antes de utilizar material estéril?",o:["Solo el color del empaque","Integridad, humedad, caducidad e indicadores aplicables","Que esté colocado en el carro","Que el paquete sea grande"],a:1,e:"La condición del empaque y los indicadores son parte de la verificación de seguridad."},
{q:"En algunos protocolos, ¿a qué instrumento se le llama localmente pinza portaobjeto?",o:["Pinza Kelly","Pinza de traslado o transferencia","Tijera Mayo","Pinza de disección con dientes"],a:1,e:"La nomenclatura varía. Debe verificarse el instrumento y el protocolo local."},
{q:"¿Cuál es la función general de la pinza de traslado?",o:["Suturar tejidos","Controlar hemorragias","Transferir material siguiendo una técnica aséptica definida","Medir la profundidad de una herida"],a:2,e:"La pinza de transferencia se utiliza para manipular material, no para sustituir instrumental quirúrgico específico."},
{q:"Si la pinza toca una superficie no estéril, ¿qué se debe hacer?",o:["Limpiarla con una gasa y continuar","Enjuagarla y volverla al recipiente","Considerarla contaminada y retirarla para reemplazo o reprocesamiento","Sumergirla unos segundos y continuar"],a:2,e:"Ante contaminación o duda, no continuar con ese instrumento. Debe reemplazarse o reprocesarse según protocolo."},
{q:"¿Una pinza sumergida en una solución desinfectante puede considerarse automáticamente estéril?",o:["Sí, siempre","Solo si la solución tiene color","No; desinfección no equivale a esterilización","Sí, si el recipiente está tapado"],a:2,e:"La desinfección no garantiza esterilidad. El método debe estar validado y autorizado."},
{q:"¿Qué debe hacerse con los punzocortantes usados?",o:["Reencapucharlos antes de desechar","Depositarlos inmediatamente en contenedor rígido autorizado","Dejarlos sobre la bandeja","Colocarlos en una bolsa común"],a:1,e:"No reencapuchar ni manipular innecesariamente. Desechar de inmediato en el contenedor apropiado."},
{q:"Al finalizar, ¿qué acción forma parte del cierre seguro?",o:["Guardar el material usado en el carro","Limpiar y desinfectar el carro, reponer insumos y registrar según protocolo","Dejar la superficie húmeda y colocar paquetes","Mezclar sobrantes para ahorrar material"],a:1,e:"El cierre incluye retiro seguro, limpieza/desinfección, reposición y registro cuando corresponda."}
];let index=0,score=0,answers=[];const quiz=document.getElementById('quiz'),progress=document.getElementById('progress'),result=document.getElementById('result');function render(){progress.textContent='PREGUNTA '+(index+1)+' DE '+questions.length;const q=questions[index];quiz.innerHTML='<article class="question"><h2>'+(index+1)+'. '+q.q+'</h2>'+q.o.map((v,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><span>'+v+'</span></label>').join('')+'<div id="feedback"></div><div class="actions"><button id="check">Comprobar respuesta</button></div></article>';document.getElementById('check').addEventListener('click',check)}function check(){const selected=document.querySelector('input[name="answer"]:checked');const fb=document.getElementById('feedback');if(!selected){fb.innerHTML='<p class="feedback wrong">Selecciona una opción para continuar.</p>';return}const value=Number(selected.value),q=questions[index],correct=value===q.a;answers.push(value);if(correct)score++;document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);fb.innerHTML='<p class="feedback '+(correct?'':'wrong')+'"><strong>'+(correct?'¡Correcto!':'Revisa este concepto.')+'</strong> '+q.e+'</p><div class="actions"><button id="next">'+(index===questions.length-1?'Ver resultado':'Siguiente pregunta')+'</button></div>';document.getElementById('next').addEventListener('click',()=>{if(index<questions.length-1){index++;render()}else finish()})}function finish(){quiz.classList.add('hidden');progress.textContent='EVALUACIÓN TERMINADA';result.classList.remove('hidden');const pct=Math.round(score/questions.length*100);result.innerHTML='<p class="eyebrow">RESULTADO</p><div class="score">'+score+'/'+questions.length+'</div><h2>'+pct+'% de aciertos</h2><p class="muted">'+(pct>=80?'Buen dominio de los principios. Refuerza los puntos que fallaste.':'Conviene repasar la guía y repetir la actividad antes de la práctica.')+'</p><div class="actions"><button id="retry">Reintentar</button><button class="secondary" onclick="window.print()">Imprimir resultado</button></div>';document.getElementById('retry').addEventListener('click',()=>{index=0;score=0;answers=[];quiz.classList.remove('hidden');result.classList.add('hidden');render()})}render();
</script></body></html>
