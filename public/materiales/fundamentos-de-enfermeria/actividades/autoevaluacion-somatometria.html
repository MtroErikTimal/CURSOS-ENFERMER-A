<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autoevaluación: somatometría y exploración física</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f6f7f2;color:#20312d;margin:0}.wrap{max-width:850px;margin:auto;padding:24px}article{background:white;padding:18px;border-radius:14px;margin:14px 0}h1,h2{color:#176b57}button{background:#176b57;color:white;border:0;border-radius:8px;padding:12px 18px}.feedback{font-weight:700;margin-top:8px}.good{color:#176b57}.bad{color:#9b4b31}</style></head><body><main class="wrap"><h1>Autoevaluación: somatometría y exploración física</h1><p>Selecciona una respuesta por pregunta y pulsa “Calificar”.</p><form id="quiz"></form><button id="grade" type="button">Calificar</button> <button type="button" onclick="location.reload()">Reiniciar</button><h2 id="result" aria-live="polite"></h2></main><script>const qs=[['¿Cuál es la fórmula del IMC?',['Talla/peso','Peso en kg dividido entre talla en metros al cuadrado','Peso por talla'],1,'El IMC se calcula como kg/m².'],['¿Qué describe mejor al IMC?',['Diagnóstico definitivo','Medición directa de grasa','Indicador de tamizaje que requiere contexto'],2,'No diagnostica por sí solo ni mide directamente grasa corporal.'],['¿Qué instrumento se utiliza para medir talla de pie?',['Estadímetro','Esfigmomanómetro','Cinta de pulso'],0,'El estadímetro permite una medición estandarizada.'],['¿Cómo debe colocarse la cinta para perímetro?',['Comprimiendo tejido','Horizontal y sin comprimir','En diagonal'],1,'El sitio anatómico y la tensión deben estandarizarse.'],['¿Cuál es la primera técnica general de exploración?',['Auscultación','Percusión','Inspección'],2,'La inspección inicia la valoración sistemática.'],['¿Qué secuencia se utiliza en abdomen?',['Inspección, auscultación, percusión y palpación','Palpación, inspección, auscultación y percusión','Percusión, palpación, inspección y auscultación'],0,'La palpación puede modificar los ruidos intestinales.'],['¿Qué técnica permite escuchar ruidos respiratorios?',['Palpación','Auscultación','Inspección'],1,'Se utiliza estetoscopio y puntos de auscultación apropiados.'],['¿Qué debe registrarse junto con el peso?',['Solo el número','Unidad, fecha/hora y método o equipo relevante','Una impresión subjetiva'],1,'El registro debe ser reproducible y objetivo.'],['Si la persona presenta mareo al ponerse de pie, ¿qué haces?',['Continuar rápido','Detener, asegurar y reevaluar','Dejarla sola'],1,'La seguridad y reevaluación tienen prioridad.'],['¿Es correcto aplicar puntos de corte adultos de IMC a toda edad?',['Sí','No, se requieren referencias por edad y condición','Solo en menores'],1,'Niñez, adolescencia y otras condiciones requieren criterios específicos.']];const form=document.getElementById('quiz');qs.forEach((q,i)=>{const a=document.createElement('article');a.innerHTML='<h3>'+(i+1)+'. '+q[0]+'</h3>'+q[1].map((o,j)=>'<label style="display:block;margin:8px 0"><input type="radio" name="q'+i+'" value="'+j+'"> '+o+'</label>').join('')+'<p class="feedback" id="f'+i+'"></p>';form.appendChild(a)});document.getElementById('grade').onclick=()=>{let score=0;qs.forEach((q,i)=>{const v=form.querySelector('input[name="q'+i+'"]:checked');const f=document.getElementById('f'+i);if(v&&Number(v.value)===q[2]){score++;f.className='feedback good';f.textContent='¡Correcto! '+q[3]}else{f.className='feedback bad';f.textContent='Revisa: '+q[3]}});document.getElementById('result').textContent='Resultado: '+score+'/10 ('+(score*10)+'%). '+(score>=8?'¡Excelente trabajo!':score>=6?'Buen avance; repasa las sugerencias.':'Conviene revisar la guía y volver a intentarlo.');};</script></body></html>
