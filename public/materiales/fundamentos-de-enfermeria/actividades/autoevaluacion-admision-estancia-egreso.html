<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autoevaluación admisión, estancia y egreso</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f6f7f2;color:#20312d;margin:0}.wrap{max-width:850px;margin:auto;padding:24px}article{background:white;padding:18px;border-radius:14px;margin:14px 0}h1,h2{color:#176b57}button{background:#176b57;color:white;border:0;border-radius:8px;padding:12px 18px}.feedback{font-weight:700}.good{color:#176b57}.bad{color:#9b4b31}</style></head><body><main class="wrap"><h1>Autoevaluación: admisión, estancia y egreso</h1><p>Selecciona una respuesta y califica para recibir retroalimentación.</p><form id="quiz"></form><button id="grade" type="button">Calificar</button> <button type="button" onclick="location.reload()">Reiniciar</button><h2 id="result" aria-live="polite"></h2></main><script>const qs=[['¿Qué se utiliza para identificar correctamente a una persona?',['Número de cama','Dos identificadores institucionales','Solo el apellido'],1,'La cama no es un identificador de paciente.'],['¿Qué debe priorizarse ante deterioro clínico al ingreso?',['Completar primero trámites','Atención urgente y activar respuesta','Esperar al siguiente turno'],1,'Los trámites no deben retrasar atención urgente.'],['¿Qué incluye una valoración inicial?',['Solo pertenencias','Estado general, riesgos y necesidades','Únicamente diagnóstico médico'],1,'La valoración identifica riesgos y cuidados inmediatos.'],['¿Qué favorece continuidad durante la estancia?',['Registros y comunicación estructurada','Mensajes informales incompletos','Evitar entregar pendientes'],0,'La información clara evita omisiones.'],['¿Qué datos deben transmitirse en entrega-recepción?',['Solo número de habitación','Situación, antecedentes, riesgos, dispositivos y pendientes','Solo dieta'],1,'La transferencia requiere información clínica relevante.'],['¿Cuándo se planifica el egreso?',['Solo al cruzar la puerta','Desde etapas previas de la estancia','Después de salir'],1,'La planificación anticipada permite resolver barreras.'],['¿Qué técnica verifica comprensión?',['Pedir firma sin explicar','Teach-back o repetición con palabras propias','Entregar hoja sin diálogo'],1,'La persona explica el plan con sus palabras.'],['¿Qué debe incluir educación al egreso?',['Solo horario de salida','Medicamentos, cuidados, signos de alarma y seguimiento','Solo agradecimiento'],1,'El plan debe apoyar continuidad y reconocer cuándo pedir ayuda.'],['¿Qué hacer en un traslado a otra unidad?',['Enviar sin comunicación','Coordinar recepción y transmitir resumen y riesgos','Entregar solo pertenencias'],1,'La transición requiere coordinación y transferencia de información.'],['¿Cómo debe ser el registro?',['Objetivo, oportuno, legible y atribuible','Subjetivo y sin fecha','Completar con suposiciones'],0,'La documentación debe ser trazable y no inventar datos.']];const form=document.getElementById('quiz');qs.forEach((q,i)=>{const a=document.createElement('article');a.innerHTML='<h3>'+(i+1)+'. '+q[0]+'</h3>'+q[1].map((o,j)=>'<label style="display:block;margin:8px 0"><input type="radio" name="q'+i+'" value="'+j+'"> '+o+'</label>').join('')+'<p class="feedback" id="f'+i+'"></p>';form.appendChild(a)});document.getElementById('grade').onclick=()=>{let score=0;qs.forEach((q,i)=>{const v=form.querySelector('input[name="q'+i+'"]:checked');const f=document.getElementById('f'+i);if(v&&Number(v.value)===q[2]){score++;f.className='feedback good';f.textContent='¡Correcto! '+q[3]}else{f.className='feedback bad';f.textContent='Sugerencia: '+q[3]}});document.getElementById('result').textContent='Resultado: '+score+'/10 ('+score*10+'%). '+(score>=8?'¡Excelente!':score>=6?'Buen avance; revisa la retroalimentación.':'Repasa la guía y vuelve a intentarlo.');};</script></body></html>
