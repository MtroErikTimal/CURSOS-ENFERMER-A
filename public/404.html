<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Aula Virtual del Profe Erik Timal</title>
    <script>
      const basePath = "/CURSOS-ENFERMER-A";
      const requestedPath = location.pathname.startsWith(basePath)
        ? location.pathname.slice(basePath.length)
        : "/";
      sessionStorage.setItem(
        "github-pages-route",
        `${requestedPath}${location.search}${location.hash}`,
      );
      location.replace(`${basePath}/`);
    </script>
  </head>
  <body></body>
</html>
